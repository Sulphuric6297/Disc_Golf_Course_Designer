name: Image

# The ready-to-run image (docker-compose.yml), to GitHub's registry: on main (latest and the
# date), and for a tag (its name).
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hyzerlab
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "tags=$IMAGE:${{ github.ref_name }}" >> "$GITHUB_OUTPUT";
          else echo "tags=$IMAGE:latest,$IMAGE:$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
