name: Server

# The GlideLine Studio server's tests, and signing in through the app built for it. Runs once per push
# that touches them (a pull request shows that run; one from a fork runs its own).
on:
  push:
    branches-ignore:
      - gh-pages
    paths:
      - 'server/**'
      - 'src/auth/**'
      - 'src/main.tsx'
      - 'tests/server/**'
      - 'playwright.server.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'src/auth/**'
      - 'src/main.tsx'
      - 'tests/server/**'
      - 'playwright.server.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/server.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  server:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hyzerlab
          POSTGRES_PASSWORD: hyzerlab
          POSTGRES_DB: hyzerlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hyzerlab" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install the server's dependencies
        run: npm ci
        working-directory: server

      - name: Typecheck and build the server
        run: npm run typecheck && npm run build
        working-directory: server

      - name: Server tests
        run: npm test
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://hyzerlab:hyzerlab@127.0.0.1:5432/hyzerlab_test

      - name: Install the app's dependencies and Playwright
        run: npm ci && npx playwright install --with-deps chromium

      - name: Signing in through the app
        run: |
          PGPASSWORD=hyzerlab psql -h 127.0.0.1 -U hyzerlab -d hyzerlab_test -c "create database hyzerlab_e2e"
          npx playwright test -c playwright.server.config.ts

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
